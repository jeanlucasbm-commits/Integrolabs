  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y: swap;\n  src: url(\"efa95eae-65f0-4b5e-a19b-d8fd613f42c1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"fc718a73-3f28-4b69-9d1e-3bfa0bbcb5b0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3446e52d-9206-4d56-a9cd-51dfc7d82770\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1b5eb95c-c361-4b55-9b6f-6621a880072d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ad083508-dc0d-438c-a80d-55a4ea005a5a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"54f9faea-1c2f-4fd2-9936-57a65dcbc279\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c69d4233-84ec-4e19-a56e-3135e2a208ac\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fbff4726-1554-4830-bf39-4f30203c8fc9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* — Marca IntegroLabs: paleta azul + Poppins sobre la estructura Modernist — */\n:root {\n  --font-heading: 'Poppins', sans-serif;\n  --font-body: 'Poppins', sans-serif;\n  --font-heading-weight: 700;\n  --color-text: #0e1c48;\n  --color-divider: #0e1c48;\n  --color-accent: #2b6898;\n  --color-accent-100: #e7f2f9;\n  --color-accent-200: #cfe4f2;\n  --color-accent-300: #a5cbe4;\n  --color-accent-400: #62a0c8;\n  --color-accent-500: #2b6898;\n  --color-accent-600: #235680;\n  --color-accent-700: #1b4468;\n  --color-accent-800: #133150;\n  --color-accent-900: #0b1a45;\n}\na { color: var(--color-accent-700); }\na:hover { color: var(--color-accent-600); }\n/* Template scaffolding — page layout and web-scale sizing only; every color,\n   font, radius and shadow comes from ../../styles.css. The voice is the\n   deck's, re-derived for a scrolling page: the grid SHOWS — 2px\n   rules draw the structure — red is spent as a mark, and its one field\n   moment is the poster close (the deck's divider logic: the red page sets\n   nothing small).\n\n   THE RHYTHM: a 28px leading unit (17px Archivo body at ~1.65), 14px\n   half-step; line-heights and block margins in unit multiples, heads\n   cap-trimmed, ?baselines/B to review. The deck's seat-pinning relaxes to\n   per-block discipline on a fluid page. The system's own interface\n   components (nav, buttons, inputs) keep their styles.css leading — the\n   rhythm governs the page's text, not the controls.\n\n   THE LANDING LAWS (shared by all six systems' landing templates):\n   #1 display headers break per sentence (.line spans); #2 the landing\n   advertises an invented product played straight — modernist's is Takt,\n   timetables that run like Switzerland; #3 spacing is cluster-scoped\n   (display leading ratio-governed ≈1.06 for Archivo's tight caps — the\n   display-block lattice exemption — tight single-unit gaps inside a text\n   cluster, the air between sections); #4 no hero eyebrow — the nav brand\n   names the product.\n\n   Optical left alignment: the deck's measured Archivo 800 value carries\n   verbatim (-0.058em where caps lead a display line; em-scaled). */\n:root {\n  --leading: 28px;\n  --half: 14px;\n  --edge: clamp(20px, 5vw, 72px);\n  --measure: 58ch;\n}\nhtml { scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\nbody { margin: 0; text-wrap: pretty; }\n.wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--edge); }\n/* the component demo pads the masthead with its own spacing; on the page the\n   masthead's contents take the page gutter and sit on the wrap's text axis\n   (padding-only — full-width paint such as a masthead rule is untouched) */\n.nav { padding-inline: max(var(--edge), calc((100% - 1200px) / 2 + var(--edge))); }\n.nav a { white-space: nowrap; }\n.nav a[aria-current='location'] { color: var(--color-accent); } /* in-page anchor, not\n   a page link — 'location' is the truthful value; carry the component's active ink */\n@media (max-width: 480px) { .nav a { display: none; } } /* phone width: the nav\n   keeps brand + the one action (layout-only — the component's look is\n   untouched); the full link row's min-content crosses narrow-phone widths */\n\n/* — drawn structure: the 2px rule is the section seam (the deck's header\n   band as page grammar; rules span the content column, solid — this system\n   does not fade its rules) — */\n.rule2 { height: 2px; border: 0; margin: 0; background: var(--color-divider); }\n\n/* — kicker (deck grammar: uppercase, tabular, accent; no hanging dash —\n   modernist marks are squares, and they belong to lists, not labels) — */\n.kicker {\n  display: block; font-size: 13px; line-height: var(--half);\n  letter-spacing: 0.08em; text-transform: uppercase;\n  color: var(--color-accent-700); /* accent-colored SMALL text takes the deep step —\n     6.4:1, where the base accent measures 3.8:1 (a large-text value; the\n     deck's kickers are 24px, this one is 13px) */\n  font-feature-settings: \"tnum\" 1;\n  margin: 0 0 calc(var(--leading) - var(--half));\n}\n\n/* — hero — */\n.hero { padding: calc(4 * var(--leading)) 0 calc(3 * var(--leading)); }\n.display {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(42px, 6.2vw, 84px);\n  line-height: clamp(44.5px, 6.57vw, 89px); /* law #3: ratio-governed ≈1.06 —\n     Archivo's 800 sits tight and all-cap-height; the display-block lattice\n     exemption (no 14px step is both tighter than the old look and clear) */\n  letter-spacing: -0.02em; margin: 0;\n  margin-left: -0.03em; /* optical left alignment, ajustado a Poppins */\n  text-box: trim-both cap alphabetic;\n}\n.display .line { display: block; } /* law #1: one sentence per line */\n.hero .sub { font-size: 17px; line-height: var(--leading); max-width: var(--measure);\n  margin: calc(1.5 * var(--leading) - 1cap) 0 0;\n  text-box: trim-both cap alphabetic; } /* 1.5 units: clears the display's descenders with cluster-tight air (law #3) */\n.hero .row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--leading); }\n\n/* — stat row (in-grammar: red stays a MARK on the light ground — the stat\n   numerals take the accent at display size, ≥3:1 as large text per the\n   system's own accent rule; the red FIELD is reserved for the close) — */\n.stats { padding: calc(2.5 * var(--leading)) 0; }\n.stats .grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: calc(1.5 * var(--leading)) var(--leading); }\n.stat-num { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(34px, 3.4vw, 48px); line-height: calc(2 * var(--leading));\n  color: var(--color-accent); /* display figures stay proportional — the deck's figure policy */\n  margin: 0; margin-left: -0.045em; /* digits lead — the deck's \"0\"-population value */\n  text-box: trim-both cap alphabetic; }\n.stat-label { font-size: 13px; line-height: var(--half); letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* small-text ink on the\n     light ground: 70% measures 5.8:1 (the deck's 55% furniture mix is a\n     24px large-text convention — at 13px the 4.5:1 bar applies, and 55%\n     measures only 3.7:1 here) */\n  margin: var(--half) 0 0; }\n\n/* — feature rows (the deck's ruled-toc grammar: 2px rules ON the seams,\n   red square marks hanging at the numbers — drawn structure, no cards) — */\n.features { padding: calc(3 * var(--leading)) 0 calc(2.5 * var(--leading)); }\n.feature { display: grid; grid-template-columns: minmax(64px, 160px) minmax(0, 420px) minmax(0, 1fr);\n  gap: var(--leading) clamp(24px, 4vw, 72px); align-items: baseline;\n  padding: calc(1.5 * var(--leading)) 0; }\n.feature + .feature { border-top: 2px solid var(--color-divider); } /* the ruled seam — solid, the system's weight */\n.f-num { position: relative; font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 15px; line-height: var(--leading); color: var(--color-text);\n  font-feature-settings: \"tnum\" 1; margin: 0; text-box: trim-both cap alphabetic; }\n.f-num::before { content: \"\"; position: absolute; left: -24px; top: calc(0.5cap - 5px);\n  width: 10px; height: 10px; background: var(--color-accent); } /* the deck's 10px red square,\n     hanging left of the number's axis — at narrow widths the gutter folds it away */\n@media (max-width: 1280px) { .f-num::before { display: none; } }\n.f-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 24px; line-height: var(--leading); letter-spacing: -0.01em;\n  margin: 0; text-box: trim-both cap alphabetic; }\n.f-copy { font-size: 15.5px; line-height: var(--leading); margin: 0;\n  color: color-mix(in srgb, var(--color-text) 78%, transparent);\n  max-width: 52ch; text-box: trim-both cap alphabetic; }\n\n/* — imagery split (grayscale photograph — the system prints in black and\n   white; the box pins the bundled asset's 951×665 ratio so swaps\n   cover-crop into the same frame) — */\n.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);\n  gap: var(--leading) clamp(24px, 5vw, 96px); align-items: center;\n  padding: calc(2 * var(--leading)) 0 calc(3 * var(--leading)); }\n.split-title { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 32px; line-height: calc(1.5 * var(--leading)); letter-spacing: -0.015em;\n  margin: 0; text-box: trim-both cap alphabetic; }\n.split-copy .note { font-size: 15.5px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 78%, transparent);\n  margin: calc(var(--leading) - 1cap) 0 0; max-width: 48ch; text-box: trim-both cap alphabetic; }\n.split-figure { margin: 0; }\n.split-figure image-slot { width: 100%; aspect-ratio: 951 / 665; }\n\n/* — quote (hanging punctuation, the deck's measured Archivo advances) — */\n.quote { padding: calc(2.5 * var(--leading)) 0 calc(3.5 * var(--leading)); }\n.quote blockquote {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(24px, 2.6vw, 34px); line-height: calc(1.5 * var(--leading));\n  letter-spacing: -0.015em; max-width: 32ch; margin: 0;\n  text-indent: -0.496em; /* hang the opening “ (the deck's measured advance in the 800) */\n  text-box: trim-both cap alphabetic;\n}\n.quote figcaption { font-size: 15.5px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* 5.8:1 — see .stat-label */\n  margin: calc(2 * var(--leading) - 1cap) 0 0; /* two grid units below the quote's\n     last baseline — one reads as part of the quote block; the attribution needs air */\n  text-indent: -1.209em; /* hang the leading em-dash + space (measured in the Regular) */\n  text-box: trim-both cap alphabetic; }\n\n@media (max-width: 720px) {\n  /* the phone gutter (--edge bottoms out at 20px) is narrower than the hung\n     marks' measured advances, so a hung “ or em-dash would press into or past\n     the viewport edge — seat the quote flush below this width; the hang\n     returns with the wider gutter */\n  .quote blockquote, .quote figcaption { text-indent: 0; }\n}\n\n/* — the red poster close (the deck's divider logic: the accent's one field\n   moment, type reversed to the paper token). COPY on the red is\n   display-grade only — paper display type measures 3.8:1, the deck\n   dividers' own derivation. The one small element is the ghost button, a\n   CONTROL: paper-on-red measures the same 3.8:1, which meets the system's\n   documented interface-chrome bar (the readme tunes the accent pair to at\n   least 3:1 — \"enough for icons, large text and interface chrome, not for\n   body copy\") — the same bar the system's own accent-filled primary button\n   label rides everywhere. */\n.close { background: var(--color-accent-900); color: #ffffff; }\n.close .wrap { padding-top: calc(3 * var(--leading)); padding-bottom: calc(3 * var(--leading)); }\n.close h3 { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: clamp(34px, 4.2vw, 56px); line-height: clamp(36px, 4.45vw, 59.4px); /* ≈1.06 —\n     display-grade, so it carries the display-block lattice exemption (the\n     rhythm probe excludes .display and .close h3 alike) */\n  letter-spacing: -0.015em; margin: 0; margin-left: -0.058em;\n  text-box: trim-both cap alphabetic; }\n.close h3 .line { display: block; }\n.close .row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: calc(1.5 * var(--leading)); }\n.close .btn-ghost { color: #ffffff; border-color: #ffffff; } /* contorno blanco sobre el campo azul marino */\nfooter { padding: calc(2 * var(--leading)) 0; font-size: 13px; line-height: var(--leading);\n  color: color-mix(in srgb, var(--color-text) 70%, transparent); /* 5.8:1 — see .stat-label */ }\n\n/* — responsive collapse — */\n/* the feature grid's fixed-max columns (160 + 420 + gaps) crush the copy\n   column in the tablet band, so it collapses earlier than the page */\n@media (max-width: 880px) {\n  .feature { grid-template-columns: 1fr; gap: var(--half); }\n  .f-copy { max-width: var(--measure); }\n}\n@media (max-width: 720px) {\n  .hero { padding-top: calc(2.5 * var(--leading)); }\n  .stats .grid { grid-template-columns: repeat(2, 1fr); justify-content: start; }\n  .split { grid-template-columns: 1fr; }\n  .split-figure { order: -1; }\n}\n\n/* Review aid: the 28px rhythm drawn as hairlines — debug chrome, toggled by\n   ?baselines or the B key, never part of the look. */\nbody[data-baselines] { position: relative; }\nbody[data-baselines]::after {\n  content: \"\"; position: absolute; inset: 0; pointer-events: none;\n  background:\n    repeating-linear-gradient(to bottom,\n      color-mix(in srgb, var(--color-accent) 35%, transparent) 0 1px,\n      transparent 1px var(--leading)),\n    repeating-linear-gradient(to bottom,\n      transparent 0 var(--half),\n      color-mix(in srgb, var(--color-accent) 16%, transparent) var(--half) calc(var(--half) + 1px),\n      transparent calc(var(--half) + 1px) var(--leading));\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<nav class=\"nav\">\n  <a href=\"#\" style=\"display:flex;align-items:center;\"><img src=\"7372657b-92a7-494c-9fdb-ee896f9785ad\" alt=\"IntegroLabs\" style=\"height:34px;width:auto;display:block;\"><\u002Fa>\n  <a href=\"#servicios\" aria-current=\"location\">Servicios<\u002Fa>\n  <a href=\"#proceso\">Proceso<\u002Fa>\n  <a href=\"#equipo\">Equipo<\u002Fa>\n  <a class=\"btn btn-primary\" href=\"https://meet.google.com/maj-ziao-uvt\" target=\"_blank\" rel=\"noopener\">Agendar llamada<\u002Fa>\n<\u002Fnav>\n<div class=\"wrap\">\n\n  <section class=\"hero\">\n    <h1 class=\"display\"><span class=\"line\">Tu equipo trabajando<\u002Fspan> <span class=\"line\">con IA en 30 días.<\u002Fspan><\u002Fh1>\n    <p class=\"sub\">IntegroLabs forma a tu equipo, diagnostica tus procesos e implementa inteligencia artificial en tu operación real — no en teoría. Para empresas de LATAM y EE.UU. que quieren liberar tiempo operativo, tomar mejores decisiones y crecer sin depender de más personal.<\u002Fp>\n    <div class=\"row\">\n      <a class=\"btn btn-primary\" href=\"https://meet.google.com/maj-ziao-uvt\" target=\"_blank\" rel=\"noopener\">Agendar llamada de diagnóstico<\u002Fa>\n      <a class=\"btn btn-ghost\" href=\"#servicios\">Ver cómo trabajamos<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule2\">\n\n  <section class=\"stats\" aria-label=\"Resultados que promete IntegroLabs\">\n    <div class=\"grid\">\n      <div><p class=\"stat-num\">30 días<\u002Fp><p class=\"stat-label\">Para tener un proceso real funcionando con IA<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">3<\u002Fp><p class=\"stat-label\">Procesos críticos diagnosticados y priorizados<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">4h<\u002Fp><p class=\"stat-label\">Para que cada rol identifique qué automatizar hoy<\u002Fp><\u002Fdiv>\n      <div><p class=\"stat-num\">0<\u002Fp><p class=\"stat-label\">Dependencia técnica — tu equipo queda capacitado<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule2\">\n\n  <section class=\"features\" id=\"servicios\">\n    <span class=\"kicker\">Qué hacemos por tu empresa<\u002Fspan>\n    <div class=\"feature\">\n      <p class=\"f-num\">01<\u002Fp>\n      <h2 class=\"f-title\">Tu equipo descubre qué automatizar<\u002Fh2>\n      <p class=\"f-copy\">Un taller en vivo, práctico y por área funcional. Cada participante sale con al menos una tarea de su rol que puede automatizar o acelerar con IA hoy mismo, más un kit de herramientas y prompts listos para usar.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">02<\u002Fp>\n      <h2 class=\"f-title\">Un mapa de automatización de tu operación<\u002Fh2>\n      <p class=\"f-copy\">Diagnosticamos tus procesos reales — no casos genéricos. Tu empresa sale con sus tres procesos críticos identificados, priorizados y con una ruta de implementación concreta, documentada y accionable.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">03<\u002Fp>\n      <h2 class=\"f-title\">IA funcionando, documentada y adoptada<\u002Fh2>\n      <p class=\"f-copy\">Treinta días de acompañamiento directo hasta dejar al menos un proceso real corriendo con IA: implementado con tu equipo, documentado en un SOP y listo para escalar internamente sin depender de nosotros.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr class=\"rule2\">\n\n  <section class=\"features\" id=\"proceso\" style=\"padding-bottom: calc(2 * var(--leading));\">\n    <span class=\"kicker\">Cómo funciona<\u002Fspan>\n    <div class=\"feature\">\n      <p class=\"f-num\">01<\u002Fp>\n      <h2 class=\"f-title\">Agenda una llamada de diagnóstico<\u002Fh2>\n      <p class=\"f-copy\">Treinta minutos, sin costo y sin compromiso. Entendemos tu operación, dónde se te va el tiempo y si podemos generar un resultado medible. Si no podemos, te lo decimos.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">02<\u002Fp>\n      <h2 class=\"f-title\">Diseñamos el plan sobre tus procesos<\u002Fh2>\n      <p class=\"f-copy\">Nada de plantillas genéricas: trabajamos sobre tus flujos, tus herramientas y tu equipo real. Defines con nosotros el alcance, la promesa de resultado y cómo se va a medir.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"feature\">\n      <p class=\"f-num\">03<\u002Fp>\n      <h2 class=\"f-title\">Implementamos y medimos contigo<\u002Fh2>\n      <p class=\"f-copy\">Formación, implementación y soporte directo hasta que el resultado esté funcionando y tu equipo lo haya adoptado. La única métrica que nos importa es el impacto en tu negocio.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"split\" id=\"equipo\">\n    <div class=\"split-copy\">\n      <span class=\"kicker\">Quiénes están detrás<\u002Fspan>\n      <h2 class=\"split-title\">Dos fundadores, un solo foco: resultados<\u002Fh2>\n      <p class=\"note\"><strong>Juan Manuel<\u002Fstrong> — formación de equipos en IA, diseño de workspaces empresariales y asesoría en modelo de negocio. Traduce lo técnico en sistemas simples que los equipos adoptan desde el primer día.<\u002Fp>\n      <p class=\"note\"><strong>Jean Lucas<\u002Fstrong> — embudos de adquisición B2B, asistentes conversacionales de venta y desarrollo web ágil con IA. Construye la infraestructura que convierte prospectos en clientes.<\u002Fp>\n      <p class=\"note\">No trabajamos por entregables: trabajamos por impacto. Confianza construida con resultados concretos, comunicación clara y acompañamiento real en cada etapa.<\u002Fp>\n    <\u002Fdiv>\n    <figure class=\"split-figure grayscale\">\n      <image-slot id=\"foto-equipo\" shape=\"rect\" role=\"img\" aria-label=\"Fotografía del equipo fundador\" placeholder=\"Foto del equipo — arrastra una imagen aquí\"><\u002Fimage-slot>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<section class=\"close\" id=\"agendar\">\n  <div class=\"wrap\">\n    <h3><span class=\"line\">Tu competencia ya está<\u002Fspan> <span class=\"line\">aprendiendo a usar IA.<\u002Fspan><\u002Fh3>\n    <div class=\"row\">\n      <a class=\"btn btn-ghost\" href=\"https://meet.google.com/maj-ziao-uvt\" target=\"_blank\" rel=\"noopener\">Agendar llamada de diagnóstico — sin costo<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"wrap\">\n  <footer>IntegroLabs — IA práctica, medible y sin fricción para empresas de LATAM y EE.UU.<\u002Ffooter>\n<\u002Fdiv>\n<script src=\"e10de288-aee1-4ec8-a30b-fc5b0a601ebc\"><\u002Fscript>\n<script>\n// Review aid: baseline-grid overlay — add ?baselines to the URL, or press B to toggle.\n(() => {\n  if (new URLSearchParams(location.search).has('baselines')) document.body.setAttribute('data-baselines', '');\n  addEventListener('keydown', (e) => {\n    const t = e.target;\n    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n    if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey && !e.altKey) document.body.toggleAttribute('data-baselines');\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
